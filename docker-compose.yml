  services:
    api:
      build: 
        context: .
        dockerfile: Dockerfile
      ports:
        - "8000:8000"
      volumes:
        - mlflow_artifacts:/app/mlartifacts

    mlflow:
      build: 
        context: .
        dockerfile: Dockerfile.mlflow
      ports:
      - "5000:5000"
      volumes:
      - mlflow_data:/app/mlflow_data
      - mlflow_artifacts:/app/mlartifacts

  volumes:
    mlflow_data:
    mlflow_artifacts: